name: Compila APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verifica i quattro punti della firma permanente
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_KEY" || { echo "Manca il secret SIGNING_KEY"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Manca il secret KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Manca il secret KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Manca il secret KEY_PASSWORD"; exit 1; }
          echo "$SIGNING_KEY" | base64 --decode > app/paolo-release.jks
          keytool -list -keystore app/paolo-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
      - name: Compila APK release con firma permanente
        env:
          KEYSTORE_FILE: paolo-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease
      - name: Controlla la firma dell'APK
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Manutenzione-Moto-v2.5-splash-multilingua
          path: app/build/outputs/apk/release/app-release.apk
